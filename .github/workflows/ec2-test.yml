name: EC2 Runner Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EC2 healthcheck
        run: bash scripts/healthcheck.sh

      - name: Install Node dependencies
        run: npm install

      - name: Run Playwright smoke test
        run: npx playwright test tests/smoke.spec.js --reporter=line

      - name: Upload dashboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategybar-dashboard-screenshot
          path: artifacts/strategybar-dashboard.png
          if-no-files-found: warn
