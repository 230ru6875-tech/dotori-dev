name: EC2 Runner Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EC2 healthcheck
        run: bash scripts/healthcheck.sh

      - name: Probe StrategyBar source on EC2
        run: bash scripts/ec2_strategybar_probe.sh

      - name: Install Node dependencies
        run: npm install

      - name: Run Playwright smoke test
        run: npx playwright test tests/smoke.spec.js --reporter=line

      - name: Run StrategyBar production watchdog
        run: npx playwright test tests/strategybar-watchdog.spec.js --reporter=line

      - name: Upload StrategyBar diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategybar-diagnostics
          path: |
            artifacts/strategybar-dashboard.png
            artifacts/strategybar-report.json
            artifacts/ec2-strategybar-probe.txt
            test-results/**
          if-no-files-found: warn
