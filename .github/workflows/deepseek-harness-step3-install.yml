name: DeepSeek Harness Step 3 Install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deepseek-harness-step3-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: self-hosted
    env:
      HARNESS_DIR: /home/ubuntu/projects/deepseek-harness
      HARNESS_REPO: https://github.com/deepseek-ai/deepseek-harness.git
      PATH: /usr/local/bin:/opt/node-v24.21.0-linux-x64/bin:/usr/local/sbin:/usr/sbin:/sbin:/usr/bin:/bin
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Clone official DeepSeek Harness
        shell: bash
        run: |
          set -euo pipefail
          echo '=== STEP 3A: CLONE OFFICIAL HARNESS ==='
          node --version
          pnpm --version
          git --version

          if [ -d "${HARNESS_DIR}/.git" ]; then
            git -C "${HARNESS_DIR}" remote set-url origin "${HARNESS_REPO}"
            git -C "${HARNESS_DIR}" fetch --depth=1 origin master
            git -C "${HARNESS_DIR}" reset --hard origin/master
            git -C "${HARNESS_DIR}" clean -fd
          else
            rm -rf "${HARNESS_DIR}"
            git clone --depth=1 "${HARNESS_REPO}" "${HARNESS_DIR}"
          fi

          echo "origin=$(git -C "${HARNESS_DIR}" remote get-url origin)"
          echo "commit=$(git -C "${HARNESS_DIR}" rev-parse HEAD)"
          git -C "${HARNESS_DIR}" status --short

      - name: Install dependencies
        shell: bash
        working-directory: /home/ubuntu/projects/deepseek-harness
        run: |
          set -euo pipefail
          echo '=== STEP 3B: PNPM INSTALL ==='
          pnpm install --frozen-lockfile

      - name: Ensure build swap
        shell: bash
        run: |
          set -euo pipefail
          echo '=== STEP 3C: ENSURE SWAP FOR BUILD ==='
          if ! /usr/sbin/swapon --show --noheadings | grep -q .; then
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=progress
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo /usr/sbin/swapon /swapfile
          fi
          if ! grep -qE '^/swapfile\s' /etc/fstab; then
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
          fi
          echo '--- MEMORY AFTER SWAP ---'
          free -h
          /usr/sbin/swapon --show

      - name: Build DeepSeek Harness
        shell: bash
        working-directory: /home/ubuntu/projects/deepseek-harness
        run: |
          set -euo pipefail
          echo '=== STEP 3D: BUILD ==='
          pnpm run build

      - name: Validate CLI and local Web UI
        shell: bash
        working-directory: /home/ubuntu/projects/deepseek-harness
        run: |
          set -euo pipefail
          echo '=== STEP 3E: VALIDATE CLI ==='
          pnpm dsh --help >/tmp/dsh-help.txt
          head -n 40 /tmp/dsh-help.txt

          echo '=== STEP 3F: LOCAL WEB SMOKE TEST ==='
          rm -f /tmp/dsh-web.log /tmp/dsh-web.pid
          (
            exec pnpm dsh web --no-open > /tmp/dsh-web.log 2>&1
          ) &
          PID=$!
          echo "$PID" >/tmp/dsh-web.pid

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          OK=0
          TOKEN_URL=''
          for i in $(seq 1 45); do
            TOKEN_URL=$(grep -Eo 'http://127\.0\.0\.1:3080/\?token=[A-Za-z0-9_-]+' /tmp/dsh-web.log | tail -n1 || true)
            if [ -n "$TOKEN_URL" ] && curl -fLsS --max-time 4 "$TOKEN_URL" -o /tmp/dsh-home.html; then
              OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Harness process exited unexpectedly.'
              cat /tmp/dsh-web.log
              exit 31
            fi
            sleep 1
          done

          if [ "$OK" -ne 1 ]; then
            echo 'Harness Web UI did not become ready in time.'
            cat /tmp/dsh-web.log
            exit 32
          fi

          BYTES=$(wc -c < /tmp/dsh-home.html)
          echo "web_bytes=$BYTES"
          test "$BYTES" -gt 100
          echo "web_auth=token_ok"
          ss -ltnp 2>/dev/null | grep ':3080 ' || true
          echo
          echo '--- HARNESS LOG ---'
          tail -n 80 /tmp/dsh-web.log
          echo
          echo '=== STEP 3 COMPLETE ==='
