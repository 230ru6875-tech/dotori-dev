name: StrategyBar Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'strategybar-runtime/**'
      - 'scripts/patch_strategybar_market.mjs'
      - 'scripts/patch_strategybar_quote_integrity.mjs'
      - 'scripts/fix_strategybar_index_after_provider_patch.mjs'
      - 'scripts/patch_strategybar_force_cache.mjs'
      - 'scripts/enhance_strategybar_dashboard.mjs'
      - '.github/workflows/strategybar-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategybar-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ead7cb11a99b93959c5437fbcd01eb7
      TARGET_URL: https://strategybar.hnr2020.workers.dev
      TOSS_QUOTE_URL: ${{ secrets.TOSS_QUOTE_URL }}
      TOSS_AUTH_TOKEN: ${{ secrets.TOSS_AUTH_TOKEN }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Cloudflare token is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Preserve current single-file dashboard UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p strategybar-runtime/dist
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 StrategyBarDeploy/1.0' "${TARGET_URL}/?view=1&tab=dashboard" -o strategybar-runtime/dist/index.html
          test -s strategybar-runtime/dist/index.html
          BYTES=$(wc -c < strategybar-runtime/dist/index.html)
          echo "Preserved dashboard bytes: ${BYTES}"
          test "${BYTES}" -gt 10000

      - name: Add Investing.com Treasury yields and domestic gold
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch_strategybar_market.mjs

      - name: Add session-aware stock quotes and domestic gold integrity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch_strategybar_quote_integrity.mjs
          node scripts/fix_strategybar_index_after_provider_patch.mjs

      - name: Fix force refresh cache semantics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch_strategybar_force_cache.mjs

      - name: Enhance responsive market and stock detail cards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/enhance_strategybar_dashboard.mjs
          grep -q 'strategybar-enhancer-script' strategybar-runtime/dist/index.html

      - name: Resolve existing D1 database binding
        shell: bash
        run: |
          set -euo pipefail
          cd strategybar-runtime
          SETTINGS_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/strategybar/settings"
          HTTP_CODE=$(curl -sS -o /tmp/strategybar-worker-settings.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${SETTINGS_URL}")
          export HTTP_CODE
          DB_ID=$(node - <<'NODE'
          const fs = require('fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync('/tmp/strategybar-worker-settings.json','utf8')); } catch {}
          const bindings = body?.result?.bindings || [];
          const row = bindings.find((item) => item.name === 'DB' && (item.type === 'd1' || item.type === 'd1_database'));
          const id = row?.id || row?.database_id || row?.namespace_id;
          if (id) process.stdout.write(String(id));
          NODE
          )
          if [ -z "${DB_ID}" ]; then
            echo "Worker settings did not expose DB binding (HTTP ${HTTP_CODE}); trying D1 list fallback."
            DB_JSON=$(npx --yes wrangler@4.119.0 d1 list --json)
            export DB_JSON
            DB_ID=$(node - <<'NODE'
          const rows = JSON.parse(process.env.DB_JSON || '[]');
          const row = rows.find((item) => item.name === 'strategybar');
          const id = row?.uuid || row?.id;
          if (!id) process.exit(2);
          process.stdout.write(String(id));
          NODE
            )
          fi
          export DB_ID
          test -n "${DB_ID}"
          node - <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const id = process.env.DB_ID;
          const text = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(path, text.replace('REPLACE_AFTER_CLOUDFLARE_CONNECTION', id));
          NODE
          echo "D1 database binding resolved from existing production configuration."

      - name: Sync Toss and KIS provider secrets to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          cd strategybar-runtime
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "${value}" ]; then
              printf '%s' "${value}" | npx --yes wrangler@4.119.0 secret put "${name}" --config wrangler.jsonc >/dev/null
              echo "${name}: configured"
            else
              echo "${name}: not set in GitHub Actions secrets; provider will be skipped"
            fi
          }
          put_secret TOSS_QUOTE_URL "${TOSS_QUOTE_URL:-}"
          put_secret TOSS_AUTH_TOKEN "${TOSS_AUTH_TOKEN:-}"
          put_secret KIS_APP_KEY "${KIS_APP_KEY:-}"
          put_secret KIS_APP_SECRET "${KIS_APP_SECRET:-}"

      - name: Deploy StrategyBar worker
        shell: bash
        run: |
          set -euo pipefail
          cd strategybar-runtime
          npx --yes wrangler@4.119.0 deploy --config wrangler.jsonc

      - name: Validate provider configuration
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsSL --retry 4 --retry-delay 2 "${TARGET_URL}/api/status?t=$(date +%s)" -o /tmp/strategybar-status.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/strategybar-status.json','utf8'));
          console.log(`Toss configured: ${Boolean(s.tossConfigured)}`);
          console.log(`KIS configured: ${Boolean(s.kisConfigured)}`);
          NODE

      - name: Validate production API
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsSL --retry 5 --retry-delay 2 "${TARGET_URL}/api/market?force=1&t=$(date +%s)" -o /tmp/strategybar-market.json
          curl -fsSL --retry 5 --retry-delay 2 "${TARGET_URL}/api/market?only=SNDK&force=1&t=$(date +%s)" -o /tmp/strategybar-sndk.json
          curl -fsSL --retry 5 --retry-delay 2 "${TARGET_URL}/api/market?only=IONQ&force=1&t=$(date +%s)" -o /tmp/strategybar-ionq.json
          node - <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('/tmp/strategybar-market.json','utf8'));
          const sndkDirect = JSON.parse(fs.readFileSync('/tmp/strategybar-sndk.json','utf8'));
          const ionqDirect = JSON.parse(fs.readFileSync('/tmp/strategybar-ionq.json','utf8'));
          function check(symbol, direct) {
            const a = base.symbols?.[symbol];
            const b = direct.symbols?.[symbol];
            if (!a || !b) throw new Error(`${symbol} missing`);
            for (const row of [a,b]) {
              const price = Number(row.price);
              const prev = Number(row.previousClose);
              const pct = Number(row.changePct);
              if (!(price > 0) || !(prev > 0) || !Number.isFinite(pct)) throw new Error(`${symbol} invalid quote`);
              const calc = (price / prev - 1) * 100;
              if (Math.abs(calc - pct) > 0.15) throw new Error(`${symbol} inconsistent changePct: price=${price} prev=${prev} reported=${pct} calc=${calc}`);
            }
            console.log(`${symbol}: price=${a.price}, previousClose=${a.previousClose}, changePct=${a.changePct}, provider=${a.provider}, session=${a.priceSession}, asOf=${a.asOf}`);
          }
          if (!base.ok) throw new Error('market api returned ok=false');
          check('SNDK', sndkDirect);
          check('IONQ', ionqDirect);

          const vix=(base.market||[]).find((item)=>item.key==='^VIX' || String(item.name||item.label||'').toUpperCase()==='VIX');
          if (!vix || !(Number(vix.value) > 0)) throw new Error('VIX market card missing or invalid');
          console.log(`VIX: value=${vix.value}, source=${vix.source}`);

          for (const key of ['DGS30','DGS10','DGS2']) {
            const row=(base.market||[]).find((item)=>item.key===key);
            if (!row) throw new Error(`${key} market card missing`);
            if (!(Number(row.value) > 0)) throw new Error(`${key} value invalid: ${row.value}; error=${row.error||''}`);
            if (String(row.provider||'').toLowerCase() !== 'investing.com') throw new Error(`${key} provider must be Investing.com, got ${row.provider}`);
            if (!String(row.source||'').includes('Investing.com')) throw new Error(`${key} source must be Investing.com, got ${row.source}`);
            console.log(`${key}: value=${row.value}, previous=${row.previousClose}, change=${row.changeValue}, source=${row.source}, provider=${row.provider}`);
          }
          NODE

      - name: Validate dashboard page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "${TARGET_URL}/?view=1&tab=dashboard&t=$(date +%s)" -o /tmp/strategybar-page.html
          test -s /tmp/strategybar-page.html
          grep -q '<html' /tmp/strategybar-page.html
          grep -q 'strategybar-enhancer-script' /tmp/strategybar-page.html
          echo "StrategyBar production page is reachable and enhanced UI is present."
