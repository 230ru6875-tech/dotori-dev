name: DeepSeek Harness Step 6C Codex Login Help

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deepseek-harness-step6c-codex-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-help:
    runs-on: self-hosted
    env:
      PATH: /usr/local/bin:/opt/node-v24.21.0-linux-x64/bin:/usr/local/sbin:/usr/sbin:/sbin:/usr/bin:/bin
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Inspect Codex login commands safely
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CODEX VERSION ==='
          codex --version
          echo
          echo '=== CODEX LOGIN HELP ==='
          codex login --help
          echo
          echo '=== CODEX AUTH STATUS ==='
          set +e
          codex login status
          RC=$?
          set -e
          echo "status_exit=${RC}"
          test "${RC}" -eq 0

      - name: Run authenticated Codex read-only smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CODEX AUTHENTICATED SMOKE ==='
          OUT=/tmp/codex-ec2-smoke.txt
          rm -f "$OUT"
          timeout 180s codex exec             --ephemeral             --sandbox read-only             --cd /home/ubuntu/projects/harness-workspaces/dotori-dev             --output-last-message "$OUT"             "Read AGENTS.md in this repository. Do not modify any file. Reply with exactly CODEX_EC2_OK."
          test -s "$OUT"
          cat "$OUT"
          grep -Fxq 'CODEX_EC2_OK' "$OUT"
          echo 'codex_workspace_smoke=PASS'
