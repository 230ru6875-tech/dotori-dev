name: Dotoristock Deploy

on:
  push:
    branches: [main]
    paths:
      - 'dotoristock/**'
      - '.github/workflows/dotoristock-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ead7cb11a99b93959c5437fbcd01eb7
      PROJECT_NAME: dotoristock
      CUSTOM_DOMAIN: dotoristock.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source
        run: |
          grep -q '<title>미국주식으로 돈벌기 프로젝트</title>' dotoristock/index.html
          grep -q 'OAI-SearchBot' dotoristock/robots.txt
          grep -q 'https://dotoristock.com/' dotoristock/sitemap.xml
      - name: Ensure Cloudflare Pages project
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if ! npx --yes wrangler@4.119.0 pages project list 2>&1 | grep -qE '(^|[[:space:]│])dotoristock([[:space:]│]|$)'; then
            npx --yes wrangler@4.119.0 pages project create "${PROJECT_NAME}" --production-branch main
          fi
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.119.0 pages deploy dotoristock --project-name "${PROJECT_NAME}" --branch main
      - name: Ensure custom domain
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains"
          CURRENT="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}")"
          echo "${CURRENT}" | jq -e --arg d "${CUSTOM_DOMAIN}" '.result[]? | select(.name==$d)' >/dev/null ||             curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json"               --data "{\"name\":\"${CUSTOM_DOMAIN}\"}" "${API}" | tee /tmp/domain.json | jq -e '.success == true'
      - name: Verify Pages deployment
        run: npx --yes wrangler@4.119.0 pages deployment list --project-name "${PROJECT_NAME}"
      - name: Verify public domain
        run: |
          sleep 15
          curl -fsSL --retry 8 --retry-delay 5 https://dotoristock.com/ -o /tmp/index.html
          grep -q '<title>미국주식으로 돈벌기 프로젝트</title>' /tmp/index.html
          curl -fsSL https://dotoristock.com/robots.txt | grep -q 'OAI-SearchBot'
          curl -fsSL https://dotoristock.com/sitemap.xml | grep -q 'https://dotoristock.com/'
