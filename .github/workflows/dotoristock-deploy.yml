name: Dotoristock Deploy

on:
  push:
    branches: [main]
    paths:
      - 'dotoristock/**'
      - '.github/workflows/dotoristock-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ead7cb11a99b93959c5437fbcd01eb7
      PROJECT_NAME: dotoristock
      CUSTOM_DOMAIN: dotoristock.com
      AWS_REGION: ap-northeast-2
      AWS_DEPLOY_ROLE_ARN: arn:aws:iam::722630232019:role/Survival1000-GitHubDeployRole
      STACK_NAME: survival1000-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: Dotoristock-YouTubeFeed
          mask-aws-account-id: true
      - name: Bind public YouTube feed
        run: |
          set -euo pipefail
          STATUS_URL="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='DashboardStatusUrl'].OutputValue" --output text)"
          test -n "${STATUS_URL}"
          API="${STATUS_URL%/}/public/youtube"
          sed -i "s|__YOUTUBE_API__|${API}|g" dotoristock/youtube-market.html
          grep -q '/public/youtube' dotoristock/youtube-market.html
          curl -fsS "${API}" | jq -e '.source == "Survival1000 YouTube market scan" and (.themes|type=="array") and (.videos|type=="array")'
      - name: Verify source
        run: |
          grep -q '<title>미국주식으로 돈벌기 프로젝트</title>' dotoristock/index.html
          grep -q 'OAI-SearchBot' dotoristock/robots.txt
          grep -q 'https://dotoristock.com/' dotoristock/sitemap.xml
      - name: Ensure Cloudflare Pages project
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if ! npx --yes wrangler@4.119.0 pages project list 2>&1 | grep -qE '(^|[[:space:]│])dotoristock([[:space:]│]|$)'; then
            npx --yes wrangler@4.119.0 pages project create "${PROJECT_NAME}" --production-branch main
          fi
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.119.0 pages deploy dotoristock --project-name "${PROJECT_NAME}" --branch main
      - name: Release legacy custom domain for Survival1000
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains"
          CURRENT="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}")"
          if echo "${CURRENT}" | jq -e --arg d "${CUSTOM_DOMAIN}" '.result[]? | select(.name==$d)' >/dev/null; then
            curl -fsS -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}/${CUSTOM_DOMAIN}" | jq -e '.success == true'
            echo "Released ${CUSTOM_DOMAIN} from legacy Pages project."
          else
            echo "${CUSTOM_DOMAIN} is already released from legacy Pages project."
          fi
      - name: Diagnose custom domain and DNS
        run: |
          set -euo pipefail
          DOMAIN_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains"
          echo "=== Pages custom domain ==="
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${DOMAIN_API}" | jq '.result[] | select(.name=="dotoristock.com") | {name,status,verification_data,validation_data}'
          echo "=== Zone lookup ==="
          ZONES="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones?name=dotoristock.com")"
          echo "${ZONES}" | jq '{success, zones:[.result[]|{id,name,status}]}'
          ZONE_ID="$(echo "${ZONES}" | jq -r '.result[0].id // empty')"
          if [ -n "${ZONE_ID}" ]; then
            echo "=== Apex DNS ==="
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=dotoristock.com" | jq '{success,records:[.result[]|{id,type,name,content,proxied}]}'
          fi
      - name: Verify Pages deployment
        run: npx --yes wrangler@4.119.0 pages deployment list --project-name "${PROJECT_NAME}"
      - name: Verify legacy domain released
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains"
          CURRENT="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}")"
          if echo "${CURRENT}" | jq -e --arg d "${CUSTOM_DOMAIN}" '.result[]? | select(.name==$d)' >/dev/null; then
            echo "${CUSTOM_DOMAIN} is still attached to legacy Pages."
            exit 1
          fi
          echo "Legacy Pages custom domain release: PASS"
