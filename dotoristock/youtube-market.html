<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 미국주식 YouTube 동향 | 도토리스톡</title><meta name="description" content="Survival1000이 수집한 미국주식 YouTube 관심 테마, 종목 신호와 최근 주요 영상을 한 페이지에서 확인합니다."><meta name="robots" content="index,follow"><link rel="canonical" href="https://dotoristock.com/youtube-market.html"><style>body{max-width:1100px;margin:36px auto;padding:20px;background:#080b0f;color:#eef2f6;font:16px/1.65 system-ui}a{color:#9dc7ff}.muted{color:#9aa6b2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #27313b;border-radius:12px;padding:16px;background:#0d1218}.tag{display:inline-block;margin:3px;padding:5px 9px;border:1px solid #344454;border-radius:99px}h1,h2{line-height:1.25}</style></head><body><nav><a href="/">미국주식으로 돈벌기 프로젝트</a></nav><h1>오늘의 미국주식 YouTube 동향</h1><p class="muted">YouTube 공개 영상의 제목·채널·통계와 Survival1000의 시장 관심도 분석을 요약합니다. 영상의 주장은 투자 권유가 아니며 PAPER 후보 판단의 보조 신호로만 사용합니다.</p><div id="status">최신 데이터를 불러오는 중…</div><h2>관심 급증 테마</h2><div id="themes"></div><h2>종목 관심 신호</h2><div id="signals" class="grid"></div><h2>최근 주요 영상</h2><div id="videos" class="grid"></div><script>
const API="__YOUTUBE_API__";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch(API).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{
 document.getElementById("status").textContent="갱신 "+(d.updated_at||"미수집")+" · 영상 "+(d.video_count||0)+"개 · 채널 "+(d.channel_count||0)+"개";
 document.getElementById("themes").innerHTML=(d.themes||[]).map(x=>'<span class="tag">'+esc(x.theme)+' · '+esc(x.mentions)+'회 · '+esc(x.surge)+'×</span>').join("")||'<span class="muted">현재 집계된 급증 테마가 없습니다.</span>';
 const sig=Object.entries(d.signals||{}).sort((a,b)=>Number(b[1].score||0)-Number(a[1].score||0)).slice(0,20);
 document.getElementById("signals").innerHTML=sig.map(([s,x])=>'<article class="card"><strong>'+esc(s)+'</strong><br>관심점수 '+esc(x.score)+' · 신뢰도 '+esc(x.confidence)+'<br><span class="muted">영상 '+esc(x.video_count)+' · 채널 '+esc(x.channel_count)+'</span></article>').join("")||'<p class="muted">현재 종목 신호가 없습니다.</p>';
 document.getElementById("videos").innerHTML=(d.videos||[]).slice(0,30).map(v=>'<article class="card"><a target="_blank" rel="noopener noreferrer" href="'+esc(v.url)+'"><strong>'+esc(v.title)+'</strong></a><p>'+esc(v.channel_title)+' · '+esc(v.published_at)+'</p><span class="muted">조회 '+Number(v.view_count||0).toLocaleString()+' · 좋아요 '+Number(v.like_count||0).toLocaleString()+'</span></article>').join("")||'<p class="muted">최근 영상 데이터가 없습니다.</p>';
}).catch(e=>document.getElementById("status").textContent="YouTube 시장 데이터를 현재 불러올 수 없습니다: "+e.message);
</script></body></html>
